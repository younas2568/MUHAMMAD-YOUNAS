<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.1" />
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Islamic Geometric Ring Pattern -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.3" stroke-dasharray="8 6" />
  <circle cx="256" cy="256" r="218" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.4" />
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.2" />

  <!-- Center Halo Glow -->
  <circle cx="256" cy="245" r="160" fill="url(#halo)" />

  <!-- Eight-pointed Islamic Star (Rub el Hizb) Background Decoration -->
  <g opacity="0.25" stroke="url(#goldGrad)" stroke-width="1.5" fill="none">
    <rect x="136" y="136" width="240" height="240" rx="12" />
    <rect x="136" y="136" width="240" height="240" rx="12" transform="rotate(45 256 256)" />
  </g>

  <!-- Crescent and Star at Top -->
  <g filter="url(#shadow)">
    <!-- Crescent Moon -->
    <path d="M 285 105 A 38 38 0 1 0 245 165 A 30 30 0 1 1 285 105 Z" fill="url(#goldGrad)" />
    <!-- Star -->
    <polygon points="268,124 272,132 281,133 274,139 276,148 268,143 260,148 262,139 255,133 264,132" fill="#fef08a" />
  </g>

  <!-- Holy Quran Book on Rehal -->
  <g filter="url(#shadow)" transform="translate(0, 10)">
    <!-- Rehal (Wooden Stand) Base -->
    <path d="M 170 365 L 256 315 L 342 365 L 332 375 L 256 332 L 180 375 Z" fill="#92400e" stroke="#78350f" stroke-width="2" />
    <path d="M 200 375 L 256 340 L 312 375 L 256 405 Z" fill="#78350f" opacity="0.7" />

    <!-- Open Quran Pages Left -->
    <path d="M 256 315 C 220 280, 160 270, 130 275 C 125 276, 120 282, 120 288 L 120 338 C 160 332, 215 340, 256 365 Z" fill="#fffbeb" stroke="url(#goldGrad)" stroke-width="2" />
    <!-- Left page underlay shadow -->
    <path d="M 125 342 C 165 336, 215 344, 256 368 L 256 373 C 215 348, 165 340, 125 346 Z" fill="#d97706" />

    <!-- Open Quran Pages Right -->
    <path d="M 256 315 C 292 280, 352 270, 382 275 C 387 276, 392 282, 392 288 L 392 338 C 352 332, 297 340, 256 365 Z" fill="#fffbeb" stroke="url(#goldGrad)" stroke-width="2" />
    <!-- Right page underlay shadow -->
    <path d="M 387 342 C 347 336, 297 344, 256 368 L 256 373 C 297 348, 347 340, 387 346 Z" fill="#d97706" />

    <!-- Quran Golden Border Inscription Area on Pages -->
    <!-- Left lines -->
    <line x1="145" y1="292" x2="235" y2="305" stroke="#d97706" stroke-width="2" stroke-linecap="round" opacity="0.7" />
    <line x1="145" y1="304" x2="235" y2="317" stroke="#064e3b" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <line x1="145" y1="316" x2="235" y2="329" stroke="#064e3b" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <line x1="155" y1="328" x2="225" y2="340" stroke="#d97706" stroke-width="2" stroke-linecap="round" opacity="0.7" />

    <!-- Right lines -->
    <line x1="277" y1="305" x2="367" y2="292" stroke="#d97706" stroke-width="2" stroke-linecap="round" opacity="0.7" />
    <line x1="277" y1="317" x2="367" y2="304" stroke="#064e3b" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <line x1="277" y1="329" x2="367" y2="316" stroke="#064e3b" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <line x1="287" y1="340" x2="357" y2="328" stroke="#d97706" stroke-width="2" stroke-linecap="round" opacity="0.7" />

    <!-- Center spine ribbon -->
    <path d="M 256 315 L 256 385 L 261 390 L 265 385 L 265 320 Z" fill="#b45309" />
  </g>

  <!-- Glowing Noor Rays -->
  <g opacity="0.4" stroke="url(#goldGrad)" stroke-width="1.5">
    <line x1="256" y1="190" x2="256" y2="215" stroke-linecap="round" />
    <line x1="210" y1="210" x2="225" y2="225" stroke-linecap="round" />
    <line x1="302" y1="210" x2="287" y2="225" stroke-linecap="round" />
    <line x1="180" y1="250" x2="200" y2="255" stroke-linecap="round" />
    <line x1="332" y1="250" x2="312" y2="255" stroke-linecap="round" />
  </g>

  <!-- App Title Banner Typography -->
  <text x="256" y="445" font-family="'Amiri', 'Traditional Arabic', serif" font-size="28" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="3">نُوْرُ الْقُرْآن</text>
  <text x="256" y="475" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#a7f3d0" text-anchor="middle" letter-spacing="4">NOOR-UL-QURAN</text>
</svg>
